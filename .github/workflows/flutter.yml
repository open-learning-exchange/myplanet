name: Flutter

# Guards the Flutter port under flutter/. The Kotlin app's build.yml and
# test.yml are untouched and keep running alongside this.
on:
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: flutter

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources are gitignored, so they are rebuilt here before
      # anything reads them.
      - name: Generate code
        run: |
          rm -rf .dart_tool/build
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          rm -rf .dart_tool/build
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build debug APK
        run: flutter build apk --debug
