name: myPlanet build

on:
  push:
    branches:
      - '**'
      - '!master'

# Supersede stale runs on the same branch (this workflow never runs on master).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: myPlanet build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [default, lite]
    steps:
      - name: checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          # see test.yml: off master this cache is read-only by default, so no
          # branch run could ever seed it
          cache-read-only: false

      # see test.yml: keeps Kotlin compilation incremental across runs
      - name: restore project build dir
        uses: actions/cache@v4
        with:
          path: |
            app/build
            .gradle
          key: build-dir-build-${{ matrix.build }}-${{ github.sha }}
          restore-keys: |
            build-dir-build-${{ matrix.build }}-

      - name: build debug as test
        env:
          GRADLE_BUILD_CACHE_URL: ${{ secrets.GRADLE_BUILD_CACHE_URL }}
          GRADLE_BUILD_CACHE_USER: ${{ secrets.GRADLE_BUILD_CACHE_USER }}
          GRADLE_BUILD_CACHE_PASS: ${{ secrets.GRADLE_BUILD_CACHE_PASS }}
          # Push from every in-repo branch (fork PRs never see these secrets);
          # see test.yml for the automerge/master cache-seeding rationale.
          GRADLE_BUILD_CACHE_PUSH: 'true'
        run: |
          FLAVOR=${{ matrix.build }}
          ./gradlew assemble${FLAVOR^}Debug --configuration-cache-problems=warn --warning-mode all --stacktrace --parallel --max-workers=4
