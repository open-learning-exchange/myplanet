name: myPlanet build

on:
  push:
    branches:
      - '**'
      - '!master'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: myPlanet build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build: [default, lite]
    steps:
      - name: checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # submodules: recursive  # uncomment when a job needs .agents/skills

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: restore project build dir
        uses: actions/cache@v6
        with:
          path: |
            app/build
            .gradle/*
            !.gradle/configuration-cache
          key: build-dir-build-${{ matrix.build }}-${{ github.sha }}
          restore-keys: |
            build-dir-build-${{ matrix.build }}-

      - name: build debug as test
        env:
          GRADLE_BUILD_CACHE_URL: ${{ secrets.GRADLE_BUILD_CACHE_URL }}
          GRADLE_BUILD_CACHE_USER: ${{ secrets.GRADLE_BUILD_CACHE_USER }}
          GRADLE_BUILD_CACHE_PASS: ${{ secrets.GRADLE_BUILD_CACHE_PASS }}
          GRADLE_BUILD_CACHE_PUSH: 'true'
        run: |
          FLAVOR=${{ matrix.build }}
          ./gradlew assemble${FLAVOR^}Debug --configuration-cache-problems=warn --warning-mode all --stacktrace --parallel --max-workers=4
