name: myPlanet playstore

# Every master build is published to the playstore internal track by the
# release workflow. Play accepts 48 saves a day and answers the 49th with
# "Daily save quota exceeded." -- that build stays tagged and released on
# GitHub but never reaches the track, and the automerge drain stops, because
# it refuses to merge on top of an unpublished release.
#
# This job closes that gap without a human downloading an .aab: every 30
# minutes it asks the internal track what it has, and if the track is behind
# the newest GitHub release it re-uploads that release's signed bundle -- the
# exact file the release workflow built, no rebuild, no new version. When the
# track is current it costs two API calls and stops.
#
# It cannot beat the quota, only wait it out, so it also reports when the next
# save slot is expected (eastern time, see .github/scripts/playstore-quota.sh).
#
# Needs SERVICE_ACCOUNT_JSON, the secret the release workflow publishes with.
# Cron only ever runs the copy of this file on the default branch.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      track:
        description: 'playstore track to keep current'
        required: false
        default: 'internal'
        type: string
      daily_limit:
        description: 'saves playstore allows per day (only used to estimate the next free slot)'
        required: false
        default: '48'
        type: string
      force:
        description: 'check the track even when the last release run reported a successful publish'
        required: false
        default: false
        type: boolean
      resume_automerge:
        description: 'dispatch the automerge drain once the pending release is published'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'report what would be published, upload nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: myPlanet-playstore
  cancel-in-progress: false

jobs:
  publish:
    name: myPlanet playstore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      BASE: master
      PLAYSTORE_PACKAGE_NAME: org.ole.planet.myplanet
      PLAYSTORE_TRACK: ${{ inputs.track || 'internal' }}
      PLAYSTORE_DAILY_LIMIT: ${{ inputs.daily_limit || '48' }}
      PLAYSTORE_FORCE: ${{ inputs.force || false }}
      DRY_RUN: ${{ inputs.dry_run || false }}

    steps:
      - name: checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: work out what the track still owes
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          .github/scripts/playstore.sh pending
          quota=$(.github/scripts/playstore-quota.sh report)
          echo "$quota"
          echo "quota=$quota" >> "$GITHUB_OUTPUT"

      - name: download the signed bundle from its GitHub release
        if: steps.pending.outputs.pending == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.pending.outputs.tag }}" \
            --repo "$REPO" \
            --pattern "${{ steps.pending.outputs.asset }}" \
            --dir output
          ls -al output

      - name: publish AAB to playstore
        id: playstore
        if: steps.pending.outputs.pending == 'true' && env.DRY_RUN != 'true'
        continue-on-error: true
        uses: dogi/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAYSTORE_PACKAGE_NAME }}
          releaseFiles: output/${{ steps.pending.outputs.asset }}
          track: ${{ env.PLAYSTORE_TRACK }}
          releaseName: ${{ steps.pending.outputs.release_name }}
          status: completed

      - name: confirm the track moved
        id: confirm
        if: steps.pending.outputs.pending == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          want='${{ steps.pending.outputs.version_code }}'
          have=$(.github/scripts/playstore.sh track-code || echo '')
          if [ -n "$have" ]; then
            echo "$PLAYSTORE_TRACK track is at $have, wanted $want"
            [ "$have" -ge "$want" ] && published=true || published=false
          else
            # the track is unreadable: trust what the upload action reported
            published=${{ steps.playstore.outcome == 'success' }}
            echo "could not read the track -- taking the upload outcome (${{ steps.playstore.outcome }})"
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # A quota that has not lifted yet is not a broken run: these stay green and
      # carry the state in a warning annotation, so a blocked publish does not
      # ring an alarm every 30 minutes.
      - name: report what happened
        if: always()
        run: |
          QUOTA='${{ steps.pending.outputs.quota }}'
          if [ -z '${{ steps.pending.outputs.pending }}' ]; then
            echo "### playstore: could not work out what the ${{ env.PLAYSTORE_TRACK }} track owes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ '${{ steps.pending.outputs.pending }}' != 'true' ]; then
            echo "### playstore: ${{ env.PLAYSTORE_TRACK }} track is current" >> "$GITHUB_STEP_SUMMARY"
            echo "$QUOTA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PENDING='${{ steps.pending.outputs.release_name }}'
          if [ "$DRY_RUN" = 'true' ]; then
            echo "### playstore: would publish $PENDING" >> "$GITHUB_STEP_SUMMARY"
            echo "$QUOTA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ '${{ steps.confirm.outputs.published }}' = 'true' ]; then
            echo "### playstore: published $PENDING to ${{ env.PLAYSTORE_TRACK }}" >> "$GITHUB_STEP_SUMMARY"
            echo "$QUOTA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MESSAGE="playstore still refused $PENDING. $QUOTA -- retrying in 30 minutes."
          echo "::warning::${MESSAGE}"
          echo "### ${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: resume the automerge drain
        if: steps.confirm.outputs.published == 'true' && (inputs.resume_automerge || false)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
        run: |
          gh workflow run automerge.yml --repo "$REPO" -f dry_run=false
          echo "### dispatched the automerge drain" >> "$GITHUB_STEP_SUMMARY"
