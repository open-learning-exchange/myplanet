name: myPlanet test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs on the same branch. Master runs are never grouped at
# all: GitHub keeps at most one PENDING run per group and silently cancels a
# superseded pending run even with cancel-in-progress false, and the automerge
# drain treats a cancelled master run as red and aborts.
concurrency:
  group: test-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: myPlanet test (${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [default]
    steps:
      - name: checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          # setup-gradle keeps the Gradle home cache read-only off master, so
          # branch runs could never seed it and every push started cold
          cache-read-only: false

      # Carry the project build dir between runs so Kotlin compiles
      # incrementally instead of from scratch. Restore falls back through this
      # job's earlier runs on this branch, then master's (Actions cache scoping
      # gives every branch read access to master's entries).
      - name: restore project build dir
        uses: actions/cache@v4
        with:
          # .gradle/configuration-cache is excluded: Gradle serializes
          # configuration-time state there, including env-var credentials read
          # by settings.gradle, and Actions cache entries are readable from
          # every branch of the repo.
          path: |
            app/build
            .gradle
            !.gradle/configuration-cache
          key: build-dir-test-${{ matrix.build }}-${{ github.sha }}
          restore-keys: |
            build-dir-test-${{ matrix.build }}-

      # The restored build dir includes the previous run's test results; drop
      # them so the summary (if: always) and failure artifacts can only ever
      # contain results produced by THIS run.
      - name: drop stale test results from restored build dir
        shell: bash
        run: rm -rf app/build/test-results app/build/reports/tests

      - name: run unit tests
        shell: bash
        env:
          GRADLE_BUILD_CACHE_URL: ${{ secrets.GRADLE_BUILD_CACHE_URL }}
          GRADLE_BUILD_CACHE_USER: ${{ secrets.GRADLE_BUILD_CACHE_USER }}
          GRADLE_BUILD_CACHE_PASS: ${{ secrets.GRADLE_BUILD_CACHE_PASS }}
          # Push from every in-repo branch (fork PRs never see these secrets):
          # the automerge queue prepares commits on arbitrary contributor
          # branches, and master reruns the identical tree afterwards — the
          # master run only gets cache hits if the branch run was allowed to
          # seed the cache. Inert until GRADLE_BUILD_CACHE_URL is set: the
          # secret is currently empty, so settings.gradle disables the remote
          # cache and only the Actions-cached Gradle home is in play.
          GRADLE_BUILD_CACHE_PUSH: 'true'
        run: |
          FLAVOR=${{ matrix.build }}
          # Deliberately one job, not sharded: measured on this branch, the full
          # suite executes in ~1m50s of a ~4m job, and two shards each pay the
          # whole runner + Gradle + compile overhead again to save ~20s of wall
          # clock on two runners. app/build.gradle still accepts
          # -PtestShardTotal/-PtestShardIndex if the suite outgrows one job.
          ./gradlew test${FLAVOR^}DebugUnitTest --configuration-cache-problems=warn --warning-mode all --stacktrace --parallel --max-workers=4

      - name: summarise slowest tests
        if: always()
        shell: bash
        run: |
          FLAVOR=${{ matrix.build }}
          RESULTS="app/build/test-results/test${FLAVOR^}DebugUnitTest"
          if [ ! -d "$RESULTS" ]; then
            echo "No test results found in $RESULTS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # tee so the breakdown is in the job log too, not only the run summary page
          # --warn-over: ~120% of the full suite's 657s summed across forks
          # (2026-08); bump as the suite grows
          python3 .github/scripts/test_timing_summary.py "$RESULTS" \
            --warn-over 800 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.build }}
          # v4 artifacts are immutable per run; without overwrite a job re-run
          # 409s trying to upload the same artifact name again
          overwrite: true
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
