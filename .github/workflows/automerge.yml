name: myPlanet automerge

# Queue drainer, started by hand: for each PR labelled `automerge`, merge the
# base in, bump the version, wait for build + test, squash merge. A PR that
# conflicts, or whose prepared commit goes red, is relabelled and skipped -- the
# queue keeps draining. Needs AUTOMERGE_TOKEN. Logic, and the conditions that do
# stop it: .github/scripts/automerge.sh

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'label marking PRs as mergeable'
        required: false
        default: 'automerge'
        type: string
      priority_label:
        description: 'PRs with this label are drained before the rest; lowest number first within each tier (blank = no priority tier)'
        required: false
        default: 'priority'
        type: string
      conflict_label:
        description: 'label put on a PR that conflicts with the base, whose automerge label is then dropped (blank = drop the label without marking it)'
        required: false
        default: 'conflict'
        type: string
      red_label:
        description: 'label put on a PR whose prepared commit fails build or test, whose automerge label is then dropped (blank = drop the label without marking it)'
        required: false
        default: 'red'
        type: string
      base:
        description: 'base branch to merge into (blank = workflow default)'
        required: false
        default: ''
        type: string
      owner_login:
        description: 'credited as co-author on every PR they did not author'
        required: false
        default: 'dogi'
        type: string
      require_checks:
        description: 'refuse to merge unless the prepared commit (base merged in + version bumped) is green'
        required: false
        default: true
        type: boolean
      required_workflows:
        description: 'comma-separated workflows that must have passed on the prepared commit (blank = judge whatever ran)'
        required: false
        default: 'myPlanet build, myPlanet test'
        type: string
      publish_job:
        description: 'job whose "playstore upload failed twice" warning stops the drain (blank = skip the check)'
        required: false
        default: 'myPlanet release (lite)'
        type: string
      delete_branch:
        description: 'delete each head branch after merging'
        required: false
        default: true
        type: boolean
      max_merges:
        description: 'stop after this many merges (0 = until the queue is empty)'
        required: false
        default: '0'
        type: string
      base_rerun_attempts:
        description: 'how often to re-run a workflow that fails on the base before stopping the drain (0 = never)'
        required: false
        default: '1'
        type: string
      head_rerun_attempts:
        description: 'how often to re-run a workflow that fails on a prepared commit before the PR is dropped from the queue (0 = never)'
        required: false
        default: '1'
        type: string
      wait_timeout_minutes:
        description: 'how long to wait for workflows: build and test on the prepared commit, and whatever is in flight on the base'
        required: false
        default: '45'
        type: string
      dry_run:
        description: 'report what would happen, change nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: automerge
  cancel-in-progress: false

env:
  DEFAULT_BASE: master
  GRADLE_FILE: app/build.gradle

jobs:
  automerge:
    name: myPlanet automerge
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}

      - name: stage helper scripts outside the work tree
        id: stage
        shell: bash
        run: |
          # PR branches get checked out; run from a copy they cannot swap.
          mkdir -p "$RUNNER_TEMP/scripts"
          cp .github/scripts/automerge.sh \
             .github/scripts/version.sh \
             .github/scripts/coauthors.sh \
             .github/scripts/playstore-quota.sh \
             .github/scripts/playstore.sh "$RUNNER_TEMP/scripts/"
          chmod +x "$RUNNER_TEMP/scripts/"*.sh
          echo "dir=$RUNNER_TEMP/scripts" >> "$GITHUB_OUTPUT"

      - name: drain the automerge queue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          USING_PAT: ${{ secrets.AUTOMERGE_TOKEN != '' }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base || env.DEFAULT_BASE }}
          LABEL: ${{ inputs.label }}
          CONFLICT_LABEL: ${{ inputs.conflict_label }}
          RED_LABEL: ${{ inputs.red_label }}
          PRIORITY_LABEL: ${{ inputs.priority_label }}
          REQUIRE_CHECKS: ${{ inputs.require_checks }}
          REQUIRED_WORKFLOWS: ${{ inputs.required_workflows }}
          PUBLISH_JOB: ${{ inputs.publish_job }}
          DELETE_BRANCH: ${{ inputs.delete_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_MERGES: ${{ inputs.max_merges }}
          WAIT_TIMEOUT_MIN: ${{ inputs.wait_timeout_minutes }}
          BASE_RERUN_ATTEMPTS: ${{ inputs.base_rerun_attempts }}
          HEAD_RERUN_ATTEMPTS: ${{ inputs.head_rerun_attempts }}
          VERSION_SH: ${{ steps.stage.outputs.dir }}/version.sh
          COAUTHORS_SH: ${{ steps.stage.outputs.dir }}/coauthors.sh
          QUOTA_SH: ${{ steps.stage.outputs.dir }}/playstore-quota.sh
          PLAYSTORE_SH: ${{ steps.stage.outputs.dir }}/playstore.sh
          OWNER_LOGIN: ${{ inputs.owner_login }}
        run: '${{ steps.stage.outputs.dir }}/automerge.sh'
