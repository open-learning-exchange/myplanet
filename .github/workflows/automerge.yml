name: myPlanet automerge

# Manually started queue drainer: for each PR labelled `automerge`, merge the
# base in, bump the version, wait for build + test, squash merge. The label is
# the safety rail. Logic in .github/scripts/automerge.sh.
#
# A PR that conflicts with the base no longer stops the drain: it loses the
# `automerge` label, gains `conflict`, and the queue moves on to the next PR.
# Resolve the conflict and re-add `automerge` to queue it again.
#
# Needs AUTOMERGE_TOKEN. GITHUB_TOKEN cannot merge into a protected branch,
# and its pushes do not trigger the workflow runs the drain waits for.
#
# A release that never reached the playstore stops the drain, reporting when
# the next save slot frees and the playstore workflow that publishes it.
#
# A commit on the base was already built and tested green as a PR head, so a
# red workflow there is treated as flaky first: it is re-run (base_rerun_attempts
# times) and only a second failure stops the drain. Only the base's own runs
# count -- a sha is shared with every branch sitting on it -- and a `cancelled`
# run is read as absent, not as red, since `cancel-in-progress` retires runs by
# the dozen.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'label marking PRs as mergeable'
        required: false
        default: 'automerge'
        type: string
      conflict_label:
        description: 'label put on a PR that conflicts with the base, whose automerge label is then dropped (blank = drop the label without marking it)'
        required: false
        default: 'conflict'
        type: string
      base:
        description: 'base branch to merge into (blank = workflow default)'
        required: false
        default: ''
        type: string
      owner_login:
        description: 'credited as co-author on every PR they did not author'
        required: false
        default: 'dogi'
        type: string
      require_checks:
        description: 'refuse to merge unless the prepared commit (base merged in + version bumped) is green'
        required: false
        default: true
        type: boolean
      required_workflows:
        description: 'comma-separated workflows that must have passed on the prepared commit (blank = judge whatever ran)'
        required: false
        default: 'myPlanet build, myPlanet test'
        type: string
      publish_job:
        description: 'job whose "playstore upload failed twice" warning stops the drain (blank = skip the check)'
        required: false
        default: 'myPlanet release (lite)'
        type: string
      delete_branch:
        description: 'delete each head branch after merging'
        required: false
        default: true
        type: boolean
      max_merges:
        description: 'stop after this many merges (0 = until the queue is empty)'
        required: false
        default: '0'
        type: string
      base_rerun_attempts:
        description: 'how often to re-run a workflow that fails on the base before stopping the drain (0 = never)'
        required: false
        default: '1'
        type: string
      wait_timeout_minutes:
        description: 'how long to wait for workflows: build and test on the prepared commit, and whatever is in flight on the base'
        required: false
        default: '45'
        type: string
      dry_run:
        description: 'report what would happen, change nothing'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

env:
  DEFAULT_BASE: master
  GRADLE_FILE: app/build.gradle

jobs:
  automerge:
    name: myPlanet automerge
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}

      - name: stage helper scripts outside the work tree
        id: stage
        shell: bash
        run: |
          # PR branches get checked out; run from a copy they cannot swap.
          mkdir -p "$RUNNER_TEMP/scripts"
          cp .github/scripts/automerge.sh \
             .github/scripts/version.sh \
             .github/scripts/coauthors.sh \
             .github/scripts/playstore-quota.sh "$RUNNER_TEMP/scripts/"
          chmod +x "$RUNNER_TEMP/scripts/"*.sh
          echo "dir=$RUNNER_TEMP/scripts" >> "$GITHUB_OUTPUT"

      - name: drain the automerge queue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          USING_PAT: ${{ secrets.AUTOMERGE_TOKEN != '' }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base || env.DEFAULT_BASE }}
          LABEL: ${{ inputs.label }}
          CONFLICT_LABEL: ${{ inputs.conflict_label }}
          REQUIRE_CHECKS: ${{ inputs.require_checks }}
          REQUIRED_WORKFLOWS: ${{ inputs.required_workflows }}
          PUBLISH_JOB: ${{ inputs.publish_job }}
          DELETE_BRANCH: ${{ inputs.delete_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_MERGES: ${{ inputs.max_merges }}
          WAIT_TIMEOUT_MIN: ${{ inputs.wait_timeout_minutes }}
          BASE_RERUN_ATTEMPTS: ${{ inputs.base_rerun_attempts }}
          VERSION_SH: ${{ steps.stage.outputs.dir }}/version.sh
          COAUTHORS_SH: ${{ steps.stage.outputs.dir }}/coauthors.sh
          QUOTA_SH: ${{ steps.stage.outputs.dir }}/playstore-quota.sh
          OWNER_LOGIN: ${{ inputs.owner_login }}
        run: '${{ steps.stage.outputs.dir }}/automerge.sh'
