// CI only. Gradle fails on a 429 instead of trying the next repository, so the mirror goes first;
// it answers 404 for what it lacks and mavenCentral() stays behind it.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
def add = { repos -> repos.maven { name = 'CiMavenCentralMirror'; url = uri(mirror) } }

gradle.beforeSettings { s ->
    add(s.pluginManagement.repositories)
    add(s.dependencyResolutionManagement.repositories)
}
gradle.beforeProject { p -> add(p.buildscript.repositories) }
