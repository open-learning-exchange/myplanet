version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "actions:"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/app"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "all:"
    open-pull-requests-limit: 15
    groups:
      dependencies:
        patterns:
          - "*"
