name: myplanet
description: "myPlanet — offline extension of the Planet Learning Management System (Flutter port)."
publish_to: 'none'

# Kept in step with the Kotlin app's versionName/versionCode in app/build.gradle.
version: 0.69.18+6918

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Localization — replaces res/values-{ar,es,fr,ne,so}/strings.xml.
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management — replaces Hilt + ViewModel/StateFlow.
  flutter_riverpod: ^2.6.1

  # Networking — replaces Retrofit + OkHttp.
  dio: ^5.7.0

  # Local persistence — replaces Room (which itself replaced Realm).
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: 11.0.2
  mime: ^2.0.0

  # Navigation — replaces the Activity/Fragment + FragmentNavigator stack.
  go_router: ^14.6.2

  # Deep links — replaces reading `Intent.getData()` in `OnboardingActivity`.
  # The engine's own handling hands go_router a location that may carry no
  # scheme or host, and a public-survey link's origin *is* the server to fetch
  # from, so the full URI has to come from somewhere.
  app_links: ^7.2.1

  # Preferences — replaces SharedPrefManager.
  shared_preferences: ^2.3.3
  # Constraint-aware, process-death-safe background execution. Replaces the
  # Android app's direct WorkManager registrations while keeping scheduling
  # behind a Dart abstraction that is unit-testable.
  workmanager: ^0.10.7
  # Encrypted credential storage — replaces SecurePrefs (Tink-backed EncryptedSharedPreferences).
  flutter_secure_storage: ^9.2.2

  # HMAC-SHA1 primitive used by the PBKDF2 port of AndroidDecrypter.
  crypto: ^3.0.6
  # AES-CBC for the other half of AndroidDecrypter — health records are
  # encrypted at rest and on the server, and `package:crypto` is digests only.
  pointycastle: ^4.0.0
  # @immutable on the pure-Dart core, which must not import package:flutter.
  meta: ^1.15.0
  # Diacritic folding for titleNormal — stands in for java.text.Normalizer NFD,
  # which has no dart:core equivalent.
  diacritic: ^0.1.6
  # Submission report generation — replaces Android PdfDocument.
  pdf: ^3.11.3
  # Media viewing — replaces Media3/ExoPlayer for video/audio.
  video_player: ^2.9.2
  # PDF viewing — replaces PdfRenderer.
  pdfx: ^2.6.0
  # Markdown rendering — replaces Markwon. `flutter_markdown` is discontinued.
  flutter_markdown_plus: ^1.0.3
  # HTML resource rendering — replaces `WebViewActivity`, which loads a
  # downloaded HTML bundle's entry file in an Android WebView. The port loads
  # the same local file via `WebViewController.loadFile`.
  webview_flutter: ^4.10.0
  # Offline maps — replaces OSMDroid.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Calendar widget — replaces applandeo/materialcalendarview for team calendar.
  table_calendar: ^3.1.3
  # Profile photo selection — replaces the `Intent.ACTION_GET_CONTENT` +
  # `CropImage` flow in `UserProfileFragment`. The Kotlin picks an image and
  # crops it; image_picker's `maxWidth`/`maxHeight` resize on the device, which
  # is the same effective outcome without a separate crop dependency.
  image_picker: ^1.1.2
  # Opening external links — replaces `LinkMovementMethod` in the static
  # About/Disclaimer fragments, where `<a href>` links open in the browser.
  url_launcher: ^6.3.1
  # OS notifications — replaces `NotificationUtils`'s `NotificationCompat`
  # builder and channel setup, which `TaskNotificationWorker` uses to surface
  # task deadlines while the app is not running. Only the Android side is used;
  # the shipping app is Android-only.
  flutter_local_notifications: ^22.3.0
  # In-tree plugin carrying the `disk_stats`/`device_stats` method channels.
  # Being a plugin (rather than MainActivity registrations) puts them in
  # GeneratedPluginRegistrant, so headless WorkManager engines get them too —
  # closing the MissingPluginException gap Phases 45–46 papered over with
  # UI-primed preference caches.
  planet_platform_channels:
    path: packages/planet_platform_channels
  # Runtime app version/build number — replaces `BuildConfig.VERSION_NAME` /
  # `BuildConfig.VERSION_CODE` for the About and Settings version lines. The
  # port had been hardcoding `0.62.97` / `Build 6297`, which drifts from the
  # pubspec version on every release.
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  # Used only by tool/arb_from_strings_xml.dart, which reads the Kotlin app's
  # res/values-*/strings.xml to derive the locale .arb files.
  xml: ^7.0.1

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
