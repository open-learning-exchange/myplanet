// From DefaultSdkProvider; dependabot cannot bump these. See docs/TESTING.md.
def robolectricSdkJarsFrom = '4.16.1'
def robolectricPinned = libs.versions.robolectric.get()
def robolectricSdkJars = [
    26: '8.0.0_r4-robolectric-r1-i7',
    27: '8.1.0-robolectric-4611349-i7',
    28: '9-robolectric-4913185-2-i7',
