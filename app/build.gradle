    31: '12-robolectric-7732740-i7',
    32: '12.1-robolectric-8229987-i7',
    33: '13-robolectric-9030017-i7',
    34: '14-robolectric-10818077-i7',
    36: '16-robolectric-13921718-i7',
]
// One per level: nine versions of one module would collapse to the newest.
robolectricSdkJars.each { apiLevel, jarVersion ->
    configurations.create("robolectricSdk$apiLevel")
    dependencies.add("robolectricSdk$apiLevel", "org.robolectric:android-all-instrumented:$jarVersion")
}
// Outside app/build: that cache is keyed per commit, Gradle's dependency cache is not.
def robolectricSdkDir = new File(rootDir, 'build/robolectric-sdks')
def fetchRobolectricSdks = tasks.register('fetchRobolectricSdks', Sync) {
    description = 'Stages the android-all jars Robolectric would otherwise fetch inside the test forks'
    robolectricSdkJars.keySet().each { apiLevel -> from configurations.getByName("robolectricSdk$apiLevel") }
    into robolectricSdkDir
    doLast {
        if (robolectricPinned != robolectricSdkJarsFrom) {
            throw new GradleException("robolectricSdkJars was read from Robolectric $robolectricSdkJarsFrom, but the catalog now pins $robolectricPinned - refresh every version from its DefaultSdkProvider")
        }
        def missing = robolectricSdkJars
            .collect { apiLevel, jarVersion -> "android-all-instrumented-${jarVersion}.jar" }
            .findAll { !new File(robolectricSdkDir, it).isFile() }
        if (missing) {
            throw new GradleException("Missing from $robolectricSdkDir: ${missing.join(', ')}")
        }
    }
}
if ((project.findProperty('robolectricOffline') ?: 'false').toString().toBoolean()) {
    tasks.withType(Test).configureEach {
        dependsOn fetchRobolectricSdks
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', robolectricSdkDir.absolutePath
    }
}
