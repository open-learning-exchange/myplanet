# Default every Robolectric test to a plain Application.
#
# Without this, Robolectric boots the manifest's application class — the real
# @HiltAndroidApp MainApplication — for any test that does not say otherwise.
# MainApplication.onCreate() builds the Hilt graph, opens the Room database and
# launches fire-and-forget coroutines on the real Dispatchers.IO/Default from an
# application scope that nothing cancels: the deferred warm-ups and the ANR
# watchdog, which promptly "detects" an ANR because Robolectric's main looper is
# only pumped when a test asks. Those coroutines outlive the test class, and a
# later class that mockkObject(MainApplication.Companion)s and unmocks it turns
# their next companion call into MockKException. That escapes to the global
# handler, where kotlinx-coroutines-test queues it and charges it to whichever
# test calls runTest next — UncaughtExceptionsBeforeTest in an unrelated class.
#
# Tests that want the real application, or HiltTestApplication, still ask for it
# with @Config(application = ...).
application=android.app.Application
