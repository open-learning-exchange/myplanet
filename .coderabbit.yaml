# CodeRabbit configuration for myPlanet
# Reviews are opt-in: add the `review` label and CodeRabbit picks the PR up,
# then re-reviews each push. An unlabelled PR is never reviewed.
#
# Because a review only happens when somebody asks for one, ceremony and
# substance point opposite ways here: every decorative section is off, and the
# review itself is turned up. A labelled PR answered with "LGTM" wasted the ask.
# Reference: https://docs.coderabbit.ai/reference/configuration
language: "en-US"

tone_instructions: >-
  Correctness first: bugs, security, data loss. Then the conventions in
  CLAUDE.md. Skip whatever detekt and the Gradle build already report. No
  compliments, no restating the diff.

reviews:
  # Somebody asked for this one, so hand over the findings, nitpicks included.
  profile: assertive

  # Ceremony off. None of it is why anyone reaches for the label.
  sequence_diagrams: false
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  # ...including the "Review skipped" notice the gate posts on every other PR.
  review_status: false

  # Keep the collapsible "Prompt for AI agents" block: it is how a Claude or
  # Codex session applies a finding without a human retyping it.
  enable_prompt_for_ai_agents: true

  path_filters:
    - "!gradle/wrapper/**"
    - "!**/*.png"
    - "!**/*.webp"
    - "!**/*.jpg"

  path_instructions:
    - path: "app/src/main/java/**"
      instructions: >-
        All persistence must go through Room DAOs or DatabaseService -- flag
        raw SQLite or Realm usage. Flag hard-coded Dispatchers.* (inject
        DispatcherProvider instead) and hard-coded user-facing strings (must
        be string resources). Schema changes must bump the version in
        AppDatabase (drop-and-resync strategy, no hand-written migrations).
    - path: "app/src/test/**"
      instructions: >-
        Tests use MockK, runTest, MainDispatcherRule and TestDispatcherProvider.
        Flag Mockito usage, Thread.sleep, or hard-coded dispatchers in tests.
    - path: "app/build.gradle"
      instructions: >-
        Every merge bumps versionCode and versionName here, so that hunk is
        expected -- review the rest of the file and say nothing about the bump.

  auto_review:
    # `review` is planet's trigger word too. enabled false plus a positive
    # label is CodeRabbit's documented opt-in idiom: the label starts the
    # review, auto_incremental_review keeps it following each push after that.
    # At ~24 merges a day, reviewing every PR would spend the OSS allowance
    # (1-10 reviews an hour, scaled by stars) on autopilot instead of on ask.
    enabled: false
    labels: ["review"]
    auto_incremental_review: true
    # Labelling a draft is a deliberate act, so honour it: open a draft, ask
    # for a review, fix, then mark ready.
    drafts: true

  # Finishing touches stay on-demand (checkbox or @coderabbitai command):
  # docstrings, unit_tests, autofix, fix_ci and resolve_merge_conflict are all
  # enabled by default, so only `simplify` needs opting in.
  finishing_touches:
    simplify:
      enabled: true

  pre_merge_checks:
    # KDoc coverage is not a project goal; a standing 80% warning is pure noise.
    docstring_coverage:
      mode: "off"

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"

code_generation:
  unit_tests:
    path_instructions:
      - path: "app/src/test/**"
        instructions: >-
          Use MockK (mockk, coEvery, coVerify) -- never Mockito. Coroutine
          tests use runTest with MainDispatcherRule and inject
          TestDispatcherProvider. Use Robolectric only when Android framework
          classes are required. Place tests mirroring the main package path so
          CI (testDefaultDebugUnitTest) picks them up.
